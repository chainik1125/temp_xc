<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Steering demo — α slider</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 1200px; margin: 1em auto; padding: 0 1em; line-height: 1.5; color: #222; }
  h1 { font-size: 1.4em; }
  .meta { background: #f3f3f3; padding: 0.6em 1em; border-radius: 6px; font-size: 0.85em; margin-bottom: 1em; }
  .meta code { background: #e7e7e7; padding: 0 4px; border-radius: 3px; }
  .feat-tabs { display: flex; gap: 0.5em; margin-bottom: 1em; flex-wrap: wrap; }
  .feat-tab { padding: 0.5em 1em; background: #ddd; border-radius: 6px; cursor: pointer; user-select: none; font-size: 0.9em; }
  .feat-tab.active { background: #2a5a2a; color: white; }
  .control { position: sticky; top: 0; background: white; padding: 1em 0; border-bottom: 2px solid #ddd; margin-bottom: 1em; z-index: 10; }
  .alpha-display { font-size: 1.2em; font-weight: bold; color: #2a5a2a; }
  .alpha-slider { width: 100%; margin: 0.5em 0; }
  .alpha-ticks { display: flex; justify-content: space-between; font-size: 0.7em; color: #777; padding: 0 4px; }
  .alpha-stats { font-size: 0.95em; color: #333; }
  .prompt-block { border: 1px solid #ddd; border-radius: 8px; margin-bottom: 1.5em; padding: 1em; background: #fafafa; }
  .completion { white-space: pre-wrap; background: white; padding: 0.8em; border-radius: 4px; font-size: 0.92em; border-left: 4px solid #2a5a2a; }
  .completion.unsteered { border-left-color: #777; }
  .completion-label { font-size: 0.78em; color: #555; margin-bottom: 0.3em; font-weight: 600; display: flex; gap: 0.6em; }
  .completion-label .score { font-weight: 400; color: #2a5a2a; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8em; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  .empty { color: #888; font-style: italic; padding: 1em; }
</style>
</head>
<body>
<h1>Steering demo — α slider</h1>

<div class="meta" id="meta">Loading…</div>
<div class="feat-tabs" id="feat-tabs"></div>

<div class="control">
  <div class="alpha-display">Steering α = <span id="alpha-val">0</span></div>
  <input type="range" class="alpha-slider" id="alpha-slider" min="0" max="0" step="1" value="0" />
  <div class="alpha-ticks" id="alpha-ticks"></div>
  <div class="alpha-stats" id="alpha-stats"></div>
</div>

<div id="prompts"></div>

<script>
let DATA = null;          // {meta, features: [{feature_id, alphas: [{alpha, completions: [{text,align,coh}]}]}]}
let CURRENT_FEAT = 0;     // index into DATA.features

async function tryLoadIndex() {
  // Look for index.json that lists all available feature jsons
  const r = await fetch('index.json');
  if (!r.ok) return null;
  return r.json();
}

async function tryLoadDemo() {
  // Fallback: single demo.json (gen_steered_demo.py output)
  const r = await fetch('demo.json');
  if (!r.ok) return null;
  return r.json();
}

function adaptDemoToData(demo) {
  // gen_steered_demo.py format: {meta, prompts: [{question, completions_by_alpha: {α_str: text}}]}
  // Convert to the unified per-feature format.
  const alphas = demo.meta.alphas;
  const features = [{
    feature_id: demo.meta.feature_id,
    alphas: alphas.map(a => ({
      alpha: a,
      completions: demo.prompts.map(p => ({
        text: p.completions_by_alpha[(a >= 0 ? '+' : '') + a.toFixed(2)] ?? '',
        align: null, coh: null, question: p.question,
      })),
    })),
  }];
  return {meta: demo.meta, features};
}

function adaptIndexToData(index) {
  // index.json format: {meta, features: [{feature_id, file: "feat<id>.json"}]}
  // Returns a promise for the merged data.
  return Promise.all(index.features.map(async f => {
    const r = await fetch(f.file);
    const fd = await r.json();
    return {feature_id: fd.feature_id, alphas: fd.alphas};
  })).then(features => ({meta: index.meta, features}));
}

async function load() {
  let data;
  const idx = await tryLoadIndex();
  if (idx) {
    data = await adaptIndexToData(idx);
  } else {
    const d = await tryLoadDemo();
    if (!d) {
      document.getElementById('meta').innerHTML = '<b>No data found.</b> Place either <code>demo.json</code> (single feature, generated by <code>gen_steered_demo.py</code>) or <code>index.json</code> + <code>feat&lt;id&gt;.json</code> files (run <code>run_wang_procedure --save_demo_completions N</code>) here.';
      return;
    }
    data = adaptDemoToData(d);
  }
  DATA = data;

  const m = data.meta;
  document.getElementById('meta').innerHTML = `
    <b>arch:</b> <code>${m.arch || '?'}</code> &nbsp;
    <b>layer:</b> <code>${m.layer || m.layer_idx || '?'}</code> &nbsp;
    ${m.ckpt ? `<b>ckpt:</b> <code>${(m.ckpt+'').split('/').pop()}</code> &nbsp;` : ''}
    ${m.seed != null ? `<b>seed:</b> <code>${m.seed}</code>` : ''}
  `;

  const tabs = document.getElementById('feat-tabs');
  tabs.innerHTML = data.features.map((f, i) =>
    `<div class="feat-tab" data-i="${i}">feat ${f.feature_id}</div>`).join('');
  tabs.querySelectorAll('.feat-tab').forEach(t => t.addEventListener('click', e => {
    CURRENT_FEAT = +e.target.dataset.i;
    setupSliderForCurrent();
    render();
  }));

  setupSliderForCurrent();
  render();
}

function setupSliderForCurrent() {
  const f = DATA.features[CURRENT_FEAT];
  const slider = document.getElementById('alpha-slider');
  slider.min = 0; slider.max = f.alphas.length - 1;
  // Default to peak-align α
  let peakIdx = 0; let peakA = -1;
  for (let i = 0; i < f.alphas.length; i++) {
    const aligns = f.alphas[i].completions.map(c => c.align).filter(x => x != null);
    const ma = aligns.length ? aligns.reduce((s,x)=>s+x,0)/aligns.length : null;
    if (ma != null && ma > peakA) { peakA = ma; peakIdx = i; }
  }
  slider.value = peakIdx;

  const ticks = document.getElementById('alpha-ticks');
  ticks.innerHTML = f.alphas.map(a => `<span>${a.alpha.toFixed(1)}</span>`).join('');

  document.querySelectorAll('.feat-tab').forEach((t, i) => {
    t.classList.toggle('active', i === CURRENT_FEAT);
  });

  slider.oninput = render;
}

function render() {
  const f = DATA.features[CURRENT_FEAT];
  const slider = document.getElementById('alpha-slider');
  const idx = +slider.value;
  const row = f.alphas[idx];
  const alpha = row.alpha;
  document.getElementById('alpha-val').textContent = alpha.toFixed(2);

  // Find α=0 row for unsteered
  const zeroRow = f.alphas.find(a => Math.abs(a.alpha) < 1e-6);

  const aligns = row.completions.map(c => c.align).filter(x => x != null);
  const cohs   = row.completions.map(c => c.coh).filter(x => x != null);
  const meanA = aligns.length ? aligns.reduce((s,x)=>s+x,0)/aligns.length : null;
  const meanC = cohs.length ? cohs.reduce((s,x)=>s+x,0)/cohs.length : null;
  document.getElementById('alpha-stats').innerHTML = meanA != null
    ? `<b>mean align</b> ${meanA.toFixed(2)} &nbsp; <b>mean coh</b> ${meanC?.toFixed(2) || '—'} &nbsp; (n=${row.completions.length})`
    : `<i>no judge scores at this α</i>`;

  const promptsDiv = document.getElementById('prompts');
  if (!row.completions.length) {
    promptsDiv.innerHTML = '<div class="empty">No completions for this α.</div>';
    return;
  }
  const N = row.completions.length;
  const html = row.completions.map((c, i) => {
    const z = zeroRow?.completions?.[i];
    const q = c.question || z?.question || `Rollout ${i+1}`;
    return `
      <div class="prompt-block">
        <div class="completion-label">Rollout ${i+1} of ${N} &nbsp; <span style="color:#333">${escapeHtml(q.slice(0, 200))}${q.length>200 ? '…' : ''}</span></div>
        <div class="grid">
          <div>
            <div class="completion-label">
              Unsteered (α=0)
              ${z?.align != null ? `<span class="score">align=${z.align.toFixed(0)}, coh=${z.coh?.toFixed(0) ?? '—'}</span>` : ''}
            </div>
            <div class="completion unsteered">${escapeHtml(z?.text ?? '(missing)')}</div>
          </div>
          <div>
            <div class="completion-label">
              Steered (α=${alpha.toFixed(2)})
              ${c.align != null ? `<span class="score">align=${c.align.toFixed(0)}, coh=${c.coh?.toFixed(0) ?? '—'}</span>` : ''}
            </div>
            <div class="completion">${escapeHtml(c.text ?? '(missing)')}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
  promptsDiv.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

load();
</script>
</body>
</html>
