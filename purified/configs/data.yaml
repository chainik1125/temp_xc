# Datasource registry — temp_bench v2.
#
# Two categories:
#   - synthetic:  in-memory generators (markov, coupled_hmm)
#   - real_lm:    activation cache from a subject LLM
#
# Schema (per datasource):
#   <name>:
#     category: synthetic | real_lm
#     # real_lm fields:
#     subject_model:  "google/gemma-2-2b-it"
#     layer:          13                    # or 'layers: [11, 12, 13, 14, 15]' for MLC
#     hookpoint:      resid_post
#     dataset:        fineweb
#     n_seqs:         24000
#     seq_len:        128
#     # synthetic fields:
#     generator:      "markov" | "coupled" | "temp_bench.data.X:fn"
#     params:         { K_hidden: 10, M_emissions: 20, d_in: 256, ... }
#     # both:
#     notes:          freeform
#
# Cache contract:
#   data_key = sha256(<spec minus notes>)[:16]
# Identical specs across runs share the same on-disk activation cache.

datasources:

  # ── Synthetic § 4 ──────────────────────────────────────────────────

  synth_smoke:
    category: synthetic
    generator: coupled
    params:
      K_hidden: 3
      M_emissions: 4
      n_parents: 2
      d_in: 16
      seq_len: 16
      n_seqs: 128
      rho: 0.7
      pi: 0.05
      p_B: 1.0
    notes: "Tiny smoke-test bench (~ms training). Used by --smoke runs."

  toy_markov_n20_d40_noisy:
    category: synthetic
    generator: markov
    params:
      n_features: 20
      d_in: 40
      seq_len: 64
      n_seqs: 4096
      rho: 0.7
      pi: 0.5
      p_A: 0.0
      p_B: 0.625
    notes: |
      § 4 Denoising bench. 20 independent Markov chains with Bernoulli
      emission noise. Hidden state recovered via temporal aggregation.

  toy_coupled_K10_M20_d256:
    category: synthetic
    generator: coupled
    params:
      K_hidden: 10
      M_emissions: 20
      n_parents: 2
      d_in: 256
      seq_len: 64
      n_seqs: 4096
      rho: 0.7
      pi: 0.05
      p_B: 1.0
    notes: |
      § 4 Coupling bench (Han exp 1c3 setup). K=10 hidden chains drive
      M=20 emissions through n_parents=2 OR-gated coupling. Tests global
      (hidden-chain) vs local (emission) feature recovery.

  toy_coupled_noisy_K10_M20_d256_pB05_np10:
    category: synthetic
    generator: coupled
    params:
      K_hidden: 10
      M_emissions: 20
      n_parents: 10
      d_in: 256
      seq_len: 64
      n_seqs: 4096
      rho: 0.9
      pi: 0.05
      p_B: 0.5
    notes: |
      § 4 max-overlap regime: TXC-base dominance bench. n_parents=K_hidden,
      p_B=0.5 emission noise. The headline regime where TXC reaches gAUC≈0.99
      at k_pos=1 while TopK-SAE drops monotonically.

  # ── Real-LM § 5 ────────────────────────────────────────────────────

  gemma_2_2b_it_l13_fineweb_24k128:
    category: real_lm
    subject_model: google/gemma-2-2b-it
    layer: 13
    hookpoint: resid_post
    dataset: HuggingFaceFW/fineweb-edu
    n_seqs: 24000
    seq_len: 128
    notes: "§ 5.1 sparse-probing anchor."

  llama_3_1_8b_base_l10_ward_nousmirror:
    category: real_lm
    subject_model: NousResearch/Meta-Llama-3.1-8B
    layer: 10
    hookpoint: resid_post
    dataset: ward_backtracking_math500
    n_seqs: 4044
    seq_len: 128
    notes: "§ 5.2 backtracking anchor (Llama-3.1-8B BASE, Ward stage B)."

  qwen_2_5_7b_instruct_medical_l15:
    category: real_lm
    subject_model: Qwen/Qwen2.5-7B-Instruct
    layer: 15
    hookpoint: resid_post
    dataset: medical_em_prompts
    n_seqs: 6000
    seq_len: 128
    notes: "§ 5.3 emergent misalignment anchor (Qwen-7B medical organism)."

  qwen_2_5_14b_instruct_finance_l24:
    category: real_lm
    subject_model: Qwen/Qwen2.5-14B-Instruct
    layer: 24
    hookpoint: resid_post
    dataset: finance_em_prompts
    n_seqs: 6000
    seq_len: 128
    notes: "§ 5.3 emergent misalignment anchor (Qwen-14B finance organism)."

  # ── FreqBench (§4 temporal-filtering stress test) ──────────────────────
  # Reconstruction of Dmitry's 2026-05-06 suite. generator returns labelled
  # sequences; the freq_bench evaluator probes the SAE code with order
  # controls. One datasource per (bench, W, σ). Sparsity (raw_k) is swept
  # via --k-pos / arch_hparams_override, NOT the datasource.

  fb_ac_smoke:
    category: synthetic
    generator: "temp_bench.data.freq_bench_data:freq_bench_ac"
    seq_len: 4
    params: { bench: ac, W: 4, sigma: 0.1, M: 8, omega: 1, d_in: 32, n_seqs: 256 }
    notes: "Tiny AC smoke cell."

  fb_dc_W8_p65_s10:
    category: synthetic
    generator: "temp_bench.data.freq_bench_data:freq_bench_dc"
    seq_len: 8
    params: { bench: dc, W: 8, p: 0.65, sigma: 0.1, d_in: 256, n_seqs: 4096 }
    notes: "DC bench, W=8, p=0.65, σ=0.1."

  fb_ac_W2_s10:
    category: synthetic
    generator: "temp_bench.data.freq_bench_data:freq_bench_ac"
    seq_len: 2
    params: { bench: ac, W: 2, sigma: 0.1, M: 32, omega: 1, d_in: 256, n_seqs: 4096 }
    notes: "AC bench, W=2, σ=0.1."

  fb_ac_W4_s10:
    category: synthetic
    generator: "temp_bench.data.freq_bench_data:freq_bench_ac"
    seq_len: 4
    params: { bench: ac, W: 4, sigma: 0.1, M: 32, omega: 1, d_in: 256, n_seqs: 4096 }
    notes: "AC bench, W=4, σ=0.1."

  fb_ac_W8_s10:
    category: synthetic
    generator: "temp_bench.data.freq_bench_data:freq_bench_ac"
    seq_len: 8
    params: { bench: ac, W: 8, sigma: 0.1, M: 32, omega: 1, d_in: 256, n_seqs: 4096 }
    notes: "AC bench, W=8, σ=0.1."

  fb_ac_W16_s10:
    category: synthetic
    generator: "temp_bench.data.freq_bench_data:freq_bench_ac"
    seq_len: 16
    params: { bench: ac, W: 16, sigma: 0.1, M: 32, omega: 1, d_in: 256, n_seqs: 4096 }
    notes: "AC bench, W=16, σ=0.1 (the strong cell in the re-analysis)."

  fb_mixed_unsigned_W16_s10:
    category: synthetic
    generator: "temp_bench.data.freq_bench_data:freq_bench_mixed"
    seq_len: 16
    params: { bench: mixed_unsigned, W: 16, sigma: 0.1, M: 127, n_classes: 10, d_in: 256, n_seqs: 4096 }
    notes: "Mixed unsigned bench, Ω10, W=16, σ=0.1."

  # ── Alternate frequency benches (af_*) — agent: altfreq ────────────────
  # Generators in temp_bench.data.altfreq_data, each returning a
  # FreqBenchData (so the generic `freq_bench` evaluator handles them with
  # no core/runner edits). Each generator MUST accept the params below as
  # kwargs plus **_ignore (the `bench` key is a label only) and a `seed`.
  # The freq_bench evaluator slides any window arch's T across seq_len=W.

  af_chirp_smoke:
    category: synthetic
    generator: "temp_bench.data.altfreq_data:chirp"
    seq_len: 4
    params: { bench: chirp, W: 4, sigma: 0.1, M: 16, d_in: 32, n_seqs: 256 }
    notes: "Tiny chirp smoke cell."

  af_chirp_W16_s10:
    category: synthetic
    generator: "temp_bench.data.altfreq_data:chirp"
    seq_len: 16
    params: { bench: chirp, W: 16, sigma: 0.1, M: 64, d_in: 256, n_seqs: 4096 }
    notes: |
      Linear-chirp bench: quadratic phase φ(t)=φ0+v t+½a t² mod M; label =
      sign of the chirp rate a (instantaneous-frequency direction). Needs
      ≥3 timesteps; aggregators fail, order-sensitive archs win.

  af_multitone_W16_s10:
    category: synthetic
    generator: "temp_bench.data.altfreq_data:multitone"
    seq_len: 16
    params: { bench: multitone, W: 16, sigma: 0.1, M: 64, n_classes: 8, d_in: 256, n_seqs: 4096 }
    notes: |
      Multi-tone selectivity bench: emission is a superposition of tones; one
      target tone per sequence sets the label (n_classes). Traces a finer
      frequency-response than the Mixed bench. A_loc=1/n_classes, oracle=1.

  af_am_W16_s10:
    category: synthetic
    generator: "temp_bench.data.altfreq_data:am"
    seq_len: 16
    params: { bench: am, W: 16, sigma: 0.1, M: 64, n_classes: 6, d_in: 256, n_seqs: 4096 }
    notes: |
      Amplitude-modulation bench: a carrier modulated by a slow envelope;
      label = modulation-rate (beat-frequency) class. Tests detecting
      structure at a frequency other than the carrier.

  af_relphase_W16_s10:
    category: synthetic
    generator: "temp_bench.data.altfreq_data:relphase"
    seq_len: 16
    params: { bench: relphase, W: 16, sigma: 0.1, M: 32, d_in: 256, n_seqs: 4096 }
    notes: |
      Two-channel relative-phase bench: two phase walks in orthogonal blocks;
      label = lead/lag sign (which channel leads). A cleaner signed-direction
      task than the single-channel AC ring walk. Reverse-control < chance.

  # ── Direct-sum "which-process" bench (ds_*) — agent: direct_sum ────────
  # Generator temp_bench.data.direct_sum_data:which_process returning a
  # FreqBenchData. J independent processes live in orthogonal d_in blocks and
  # are superposed (direct sum); the label identifies which process is
  # responsible (e.g. which dynamics generated the sequence). Sharp design:
  # processes share the same emission MARGINAL but differ in temporal
  # DYNAMICS, so only an order-sensitive arch can tell them apart. Generator
  # MUST accept these kwargs + **_ignore + seed.

  ds_which_smoke:
    category: synthetic
    generator: "temp_bench.data.direct_sum_data:which_process"
    seq_len: 4
    params: { bench: direct_sum, J: 2, W: 4, sigma: 0.1, d_in: 32, n_seqs: 256 }
    notes: "Tiny direct-sum which-process smoke cell."

  ds_which_J4_W16_s10:
    category: synthetic
    generator: "temp_bench.data.direct_sum_data:which_process"
    seq_len: 16
    params: { bench: direct_sum, J: 4, W: 16, sigma: 0.1, d_in: 256, n_seqs: 4096 }
    notes: |
      Direct sum of J=4 processes on orthogonal blocks; label = which process
      generated the sequence. Processes share emission marginal, differ in
      dynamics. A_loc=1/J (single token can't attribute), oracle=1.

  ds_which_J8_W16_s10:
    category: synthetic
    generator: "temp_bench.data.direct_sum_data:which_process"
    seq_len: 16
    params: { bench: direct_sum, J: 8, W: 16, sigma: 0.1, d_in: 256, n_seqs: 4096 }
    notes: "Direct-sum which-process, J=8 (harder attribution)."

  # ── Reed-Solomon poly-phase bench (rs_*) — degree-D ladder ─────────────
  # Generator temp_bench.data.reed_solomon_data:rs_poly_phase returning a
  # FreqBenchData with y=leading-class, velocities=signed leading coeff, and
  # coeffs=full message → the freq_bench evaluator emits all 3 targets
  # (class NTPS, sign NTPS, full-message regression NMSE). D=1 reproduces AC.

  rs_smoke:
    category: synthetic
    generator: "temp_bench.data.reed_solomon_data:rs_poly_phase"
    seq_len: 8
    params: { bench: rs_D2, W: 8, sigma: 0.1, M: 32, degree: 2, n_classes: 4, d_in: 32, n_seqs: 256 }
    notes: "Tiny Reed-Solomon smoke cell (W=8 ≥ T=5)."

  rs_D1_W16_s10:
    category: synthetic
    generator: "temp_bench.data.reed_solomon_data:rs_poly_phase"
    seq_len: 16
    params: { bench: rs_D1, W: 16, sigma: 0.1, M: 64, degree: 1, n_classes: 8, d_in: 256, n_seqs: 4096 }
    notes: "RS degree 1 (= AC bench): φ(t)=m0+m1·t. Sanity anchor vs fb_ac."

  rs_D2_W16_s10:
    category: synthetic
    generator: "temp_bench.data.reed_solomon_data:rs_poly_phase"
    seq_len: 16
    params: { bench: rs_D2, W: 16, sigma: 0.1, M: 64, degree: 2, n_classes: 8, d_in: 256, n_seqs: 4096 }
    notes: "RS degree 2 (quadratic phase = linear chirp). Needs ≥3 timesteps."

  rs_D3_W16_s10:
    category: synthetic
    generator: "temp_bench.data.reed_solomon_data:rs_poly_phase"
    seq_len: 16
    params: { bench: rs_D3, W: 16, sigma: 0.1, M: 64, degree: 3, n_classes: 8, d_in: 256, n_seqs: 4096 }
    notes: "RS degree 3 (cubic phase). Needs ≥4 timesteps; baselines degrade most."
