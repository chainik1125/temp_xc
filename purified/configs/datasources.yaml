# Data-source registry.
#
# A "datasource" describes (subject_model, layer, hookpoint, dataset, n_seqs,
# seq_len, tokenizer_revision) — everything that feeds into act_cache_key.
#
# Adding a datasource = add one entry here. Components reference datasources
# by name in their experiments/cN/run.py file. Switching IT → BASE means
# changing the DATASOURCE constant in the component's runner; nothing else
# is rewired.
#
# act_cache_key = sha256(canonical_json({
#     subject_model, layer, hookpoint, dataset, n_seqs, seq_len,
#     tokenizer_revision
# }))[:16]
#
# Toy/synthetic datasources have category=synthetic and the seed for the
# generator IS part of training_cfg, not the act_cache_key (so different
# seeds reuse the same "data spec" but produce different sequences).

datasources:

  # ── Real-LM datasources ─────────────────────────────────────────────

  gemma_2_2b_it_l13_fineweb_24k128:
    category: real_lm
    subject_model: google/gemma-2-2b-it
    layer: 13
    hookpoint: resid_post
    dataset: fineweb
    n_seqs: 24000
    seq_len: 128
    tokenizer_revision: main
    notes: |
      Phase 5 + Phase 6 anchor. C3, C4, C5 default. May port Phase 5's
      already-cached version (`data/cached_activations/gemma-2-2b-it/
      fineweb/resid_L13.npy` in the wasteland) at first build to save
      ~3 H100-hours.

  gemma_2_2b_it_l11to15_fineweb_24k128:
    category: real_lm
    subject_model: google/gemma-2-2b-it
    layers: [11, 12, 13, 14, 15]
    hookpoint: resid_post
    dataset: fineweb
    n_seqs: 24000
    seq_len: 128
    tokenizer_revision: main
    notes: |
      C3 MLC anchor (multi-layer crosscoder, decisions § 16). One model
      pass with 5 hooks captures activations at L11, L12, L13, L14, L15
      simultaneously into a single (N, L=5, seq_len, d_in) cache. L13
      mirrors the single-layer `gemma_2_2b_it_l13_fineweb_24k128` anchor
      used by C3 TopK / T-SAE / TXC; adjacent layers L11+L12+L14+L15
      are needed for MLC's paper-faithful (L=5) shared latent across 5
      layers per token.

      Cache size: 24K × 5 × 128 × 2304 × 2 bytes ≈ **70 GB** fp16.
      Build cost: ~3 H100-hours via `build_activation_cache(...)`. The
      build function detects the `layers` (list) field and registers
      hooks on each layer in one model pass.

      Existing single-layer caches are NOT reused — the cache key
      (sha256 of the dump) is unique to the multi-layer datasource
      because the `layers: [11,...,15]` list differs from `layer: 13`.

  gemma_2_2b_base_l13_fineweb_24k128:
    category: real_lm
    subject_model: google/gemma-2-2b
    layer: 13
    hookpoint: resid_post
    dataset: fineweb
    n_seqs: 24000
    seq_len: 128
    tokenizer_revision: main
    notes: "Phase 7 anchor. C3 stretch goal."

  gemma_2_2b_base_l12_fineweb_24k128:
    category: real_lm
    subject_model: google/gemma-2-2b
    layer: 12
    hookpoint: resid_post
    dataset: fineweb
    n_seqs: 24000
    seq_len: 128
    tokenizer_revision: main
    notes: "T-SAE paper anchor. Stretch goal — paper-fidelity setup."

  gemma_2_2b_base_l11to15_fineweb_24k128:
    category: real_lm
    subject_model: google/gemma-2-2b
    layers: [11, 12, 13, 14, 15]
    hookpoint: resid_post
    dataset: fineweb
    n_seqs: 24000
    seq_len: 128
    tokenizer_revision: main
    notes: |
      C3 BASE replication — multi-layer cache for MLC (decisions § 16
      stretch). Mirrors `gemma_2_2b_it_l11to15_fineweb_24k128` at the
      BASE subject. ~70 GB on disk, ~3 H100-hours to build. Used by
      agent_steer_100k's BASE C3 + C4 replication if MLC is in scope.

  gemma_2_2b_base_l13_concat_v1:
    category: real_lm
    subject_model: google/gemma-2-2b
    layer: 13
    hookpoint: resid_post
    dataset: concat_v1
    n_seqs: 3
    seq_len: variable
    tokenizer_revision: main
    notes: |
      C4 BASE replication — qualitative-latents source on the BASE
