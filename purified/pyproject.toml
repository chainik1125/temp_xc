[project]
name = "temp-bench"
version = "0.1.0"
description = "Paper-ready framework for the Temporal Crosscoders study (purified subtree)."
requires-python = ">=3.12"
dependencies = [
    "torch==2.8.0",
    "numpy>=2.1",
    "scipy>=1.14",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "plotly>=5.24",
    "tqdm>=4.66",
    "transformers>=4.46",
    "accelerate>=1.1",
    "datasets>=3.1",
    "huggingface-hub>=0.26",
    "safetensors>=0.4",
    "scikit-learn>=1.5",
    "anthropic>=0.39",
    "openai>=1.55",
    "pillow>=11",
    "pyyaml>=6.0",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temp_bench"]

[tool.uv]
# UV_LINK_MODE=copy is required on RunPod's MooseFS — see
# scripts/bootstrap_runpod.sh and ../RUNPOD_INSTRUCTIONS.md.
link-mode = "copy"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-x --tb=short"
