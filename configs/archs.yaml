# Architecture registry — temp_bench v2.
#
# Source of truth for every architecture the paper evaluates. Adding an
# arch = (1) drop a class in src/temp_bench/archs/ subclassing
# TempBenchArch + (2) register it here. The runner discovers via the
# `class_path` import string.
#
# Schema (per arch):
#   <name>:
#     class_path:      "temp_bench.archs.<file>:<Class>"
#     arch_version:    "2.0.0"  (semver; bump invalidates trained checkpoints)
#     category:        sae | tsae | tfa | mlc | txc | sae_arditi | stacked_sae
#     hparams:         { d_sae: int, k_pos: int, ... }
#     per_section_hparams:                  # optional per-paper-§ overrides
#       synthetic:    { d_sae: 40, ... }
#       probing:      { d_sae: 18432, ... }
#       em:           { d_sae: 32768, ... }
#     upstream:        "AI4LIFE-GROUP/temporal-saes@<commit>"  (adapter archs only)
#     notes:           freeform
#
# Cache contract:
#   train_key = sha256({arch_class, arch_version, hparams,
#                       seed, training_cfg, data_key})[:16]

archs:

  # ─────────────────────────────────────────────────────────────────────
  # Arch groups (which archs are compared together):
  #   • FAIR-BACKBONE SUITE (the current synthetic-bench comparison; every arch
  #     shares BatchTopK→JumpReLU + AuxK + decoder unit-norm + grad-orth, so the
  #     only variable is decode structure): batchtopk_sae, tsae, stacked_batchtopk,
  #     txc_batchtopk_pre, txc_batchtopk_post, spectral_txc{,_dcac,_full}.
  #   • TopK-LEGACY (plain-TopK backbone; the published § 4 coupling/denoising +
  #     signed_motion results stand on these): topk_sae, stacked_sae, txc_base.
  #   • OFF-AXIS (not in the decode-structure comparison): mlc (multi-LAYER
  #     crosscoder, § 5.1 probing), sae_arditi (§ 5.3 EM baseline).
  # (tsae is registered under "Adapter-wrapped" below but belongs to the
  # fair-backbone suite — it is the BatchTopK matryoshka the suite is matched to.)
  # ─────────────────────────────────────────────────────────────────────

  # ── TopK-legacy: locked TXC architectures ───────────────────────────

  txc_base:
    class_path: temp_bench.archs.txc_base:TXCBase
    arch_version: "2.0.0"
    category: txc
    hparams:
      d_sae: 18432
      k_pos: 20
      T: 5
      auxk_alpha: 0.03125
      dead_threshold_tokens: 10_000_000
    per_section_hparams:
      synthetic:  { d_sae: 20 }
      em:         { d_sae: 32768, k_pos: 25 }
      backtracking: { d_sae: 32768 }
    notes: |
      Vanilla TopK temporal crosscoder (T=5) + tsae_paper anti-dead stack.
      No matryoshka, no contrastive, no Bricken.

  txc_base_btkonly:
    class_path: temp_bench.archs.txc_base_btk:TXCBaseBTK
    arch_version: "1.1.0"
    category: txc
    hparams:
      d_sae: 18432
      k_pos: 20
      T: 5
      auxk_alpha: 0.03125
      dead_threshold_tokens: 10_000_000
      relu_mode: btk-only
    per_section_hparams:
      synthetic:  { d_sae: 20 }
      em:         { d_sae: 32768, k_pos: 25 }
      backtracking: { d_sae: 32768 }
    notes: |
      ACTMIX arm `btk-only`: twin of txc_base with the composite
      TopK-then-ReLU sparsity path replaced by BatchTopK over raw
      squashed pre-acts, following mac-a's CANONICAL Stage-1 convention
      (signed-value selection, threshold_set flag, EMA source {!=0},
      AuxK unchanged, neg_frac logged). Budget kept at the paper's
      k_win = k_pos*T per window (activation isolated). Dmitry's
      re-run gate arch. v1.0.0 ran as `txc_base_btk` (pre-convention;
      eval-path-only differences — gauc/eauc unaffected).

  txc_base_relumix:
    class_path: temp_bench.archs.txc_base_btk:TXCBaseBTK
    arch_version: "1.1.0"
    category: txc
    hparams:
      d_sae: 18432
      k_pos: 20
      T: 5
      auxk_alpha: 0.03125
      dead_threshold_tokens: 10_000_000
      relu_mode: relu-mix
    per_section_hparams:
      synthetic:  { d_sae: 20 }
      em:         { d_sae: 32768, k_pos: 25 }
      backtracking: { d_sae: 32768 }
    notes: |
      ACTMIX arm `relu-mix` CONTROL for the paper arch: ReLU then
      batch-pooled BatchTopK at the paper budget k_win=k_pos*T.
      Completes the 2x2 (selection rule x ReLU placement) with txc_base
      (per-window TopK->ReLU) and txc_base_btkonly (batch pool, no
      ReLU): attributes the btk-only level gap to prior-loss vs
      pooling. Zero-picks possible when positives are thin (that IS the
      relu-mix pathology).

  txc_base_perwinraw:
    class_path: temp_bench.archs.txc_base_btk:TXCBaseBTK
    arch_version: "1.1.0"
    category: txc
    hparams:
      d_sae: 18432
      k_pos: 20
      T: 5
      auxk_alpha: 0.03125
      dead_threshold_tokens: 10_000_000
      relu_mode: perwin-raw
    per_section_hparams:
      synthetic:  { d_sae: 20 }
      em:         { d_sae: 32768, k_pos: 25 }
      backtracking: { d_sae: 32768 }
    notes: |
      2x2 fourth corner: the paper arch's own per-window TopK selection
      over RAW pre-acts (txc_base with F.relu deleted, nothing else).
      Directly tests whether the composite's selected-negative zeroing
      hurts at all, holding selection scope fixed.

  # ── BatchTopK fair-backbone family (experiments/explorations/synthetic/STATUS.md § 4) ──────
  # Strong backbone (BatchTopK train → JumpReLU threshold eval, Bussmann
  # et al.) + AuxK + decoder unit-norm + grad-orth, applied uniformly so
  # the ONLY variable across the backtracking comparison is decode
  # structure. The published TopK archs above are left untouched (§ 4
  # coupling/denoising + signed_motion results stand).

  batchtopk_sae:
    class_path: temp_bench.archs.batchtopk_sae:BatchTopKSAE
    arch_version: "1.0.0"
    category: sae
    hparams:
      d_sae: 18432
      k_pos: 20
      auxk_alpha: 0.03125
    per_section_hparams:
      synthetic:    { d_sae: 20 }
      backtracking: { d_sae: 32768 }
    notes: "Per-token BatchTopK SAE (strong backbone, no matryoshka/contrastive)."

  stacked_batchtopk:
    class_path: temp_bench.archs.stacked_batchtopk:StackedBatchTopK
    arch_version: "1.0.0"
    category: stacked_sae
    hparams:
      d_sae: 18432
      T: 4
      k_pos: 20
      auxk_alpha: 0.03125
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: "T independent per-position BatchTopK SAEs; global B·T pool."

  txc_batchtopk_pre:
    class_path: temp_bench.archs.txc_batchtopk:TXCBatchTopKPre
    arch_version: "1.0.0"
    category: txc
    hparams:
      d_sae: 18432
      T: 4
      k_pos: 20
      auxk_alpha: 0.03125
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: |
      Pre-squash BatchTopK temporal crosscoder: BatchTopK on per-position
      pre-acts (pool B·T, budget k_pos/token), sum survivors into one
      shared window code, decode all T positions.

  txc_batchtopk_post:
    class_path: temp_bench.archs.txc_batchtopk:TXCBatchTopKPost
    arch_version: "1.0.0"
    category: txc
    hparams:
      d_sae: 18432
      T: 4
      k_pos: 20
      auxk_alpha: 0.03125
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: |
      Post-squash BatchTopK temporal crosscoder: sum pre-acts into the
      squashed code, BatchTopK on it (pool B windows, budget k_pos/window
      = k_win//T), decode all T positions. Corrects the k_win=k_pos·T
      over-count.

  # ── TXC-pro loss dissection (loss_dissection/CARD.md) ──────────────────
  # One class, four entries (spectral_txc precedent): the txc_batchtopk_post
  # backbone with per-component TXC-pro losses. consumes=sequence (slices its
  # own windows; positives = deterministic shifts). Loss-only differences —
  # params/init identical across the four, so untrained rows must coincide.

  txc_post_plain:
    class_path: temp_bench.archs.txc_post_dissect:TXCPostDissect
    arch_version: "1.0.0"
    category: txc
    hparams:
      d_sae: 18432
      T: 4
      k_pos: 20
      auxk_alpha: 0.03125
      mat_alpha: 0.0
      ctr_alpha: 0.0
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: |
      Dissection baseline: sequence-fed twin of txc_batchtopk_post (backbone
      loss only; zero-weight reduction is exact). Bridge-anchored to the
      canonical window-mode rows via Gate B (CARD § 5).

  txc_post_mat:
    class_path: temp_bench.archs.txc_post_dissect:TXCPostDissect
    arch_version: "1.0.0"
    category: txc
    hparams:
      d_sae: 18432
      T: 4
      k_pos: 20
      auxk_alpha: 0.03125
      mat_alpha: 1.0
      ctr_alpha: 0.0
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: |
      +Matryoshka: H=8 nested prefixes floor(G*d_sae/8) (paper TXC-pro spec),
      equal group weights; adds the G=1..7 prefix-recon terms on the anchor.

  txc_post_ctr:
    class_path: temp_bench.archs.txc_post_dissect:TXCPostDissect
    arch_version: "1.0.0"
    category: txc
    hparams:
      d_sae: 18432
      T: 4
      k_pos: 20
      auxk_alpha: 0.03125
      mat_alpha: 0.0
      ctr_alpha: 1.0
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: |
      +Multi-distance contrastive: cosine-normalized symmetric InfoNCE vs
      window shifts Delta in {1,2}, weights 1/(1+Delta), on the full shared
      code (toy-scale TXC-pro convention, h_size=d_sae).

  txc_post_both:
    class_path: temp_bench.archs.txc_post_dissect:TXCPostDissect
    arch_version: "1.0.0"
    category: txc
    hparams:
      d_sae: 18432
      T: 4
      k_pos: 20
      auxk_alpha: 0.03125
      mat_alpha: 1.0
      ctr_alpha: 1.0
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: |
      +Both: exactly the mat + ctr terms added together (compositional by
      construction; interaction I = D_both - D_mat - D_ctr is descriptive).

  # ── pre-backbone extension (CARD § 9 amendment): same four variants on
  # TXCBatchTopKPre's squash hooks; pooled family (d_sae >= k_pos*T). ──

  txc_pre_plain:
    class_path: temp_bench.archs.txc_post_dissect:TXCPreDissect
    arch_version: "1.0.0"
    category: txc
    hparams:
      d_sae: 18432
      T: 4
      k_pos: 20
      auxk_alpha: 0.03125
      mat_alpha: 0.0
      ctr_alpha: 0.0
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: |
      Pre-extension baseline: sequence-fed twin of txc_batchtopk_pre.

  txc_pre_mat:
    class_path: temp_bench.archs.txc_post_dissect:TXCPreDissect
    arch_version: "1.0.0"
    category: txc
    hparams:
      d_sae: 18432
      T: 4
      k_pos: 20
      auxk_alpha: 0.03125
      mat_alpha: 1.0
      ctr_alpha: 0.0
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: |
      Pre-extension +matryoshka (H=8 nested prefixes, CARD § 2 spec).

  txc_pre_ctr:
    class_path: temp_bench.archs.txc_post_dissect:TXCPreDissect
    arch_version: "1.0.0"
    category: txc
    hparams:
      d_sae: 18432
      T: 4
      k_pos: 20
      auxk_alpha: 0.03125
      mat_alpha: 0.0
      ctr_alpha: 1.0
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: |
      Pre-extension +contrastive (InfoNCE shifts {1,2}, w=1/(1+d)) —
      carries prediction (v): the additive decode cannot exploit it.

  txc_pre_both:
    class_path: temp_bench.archs.txc_post_dissect:TXCPreDissect
    arch_version: "1.0.0"
    category: txc
    hparams:
      d_sae: 18432
      T: 4
      k_pos: 20
      auxk_alpha: 0.03125
      mat_alpha: 1.0
      ctr_alpha: 1.0
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: |
      Pre-extension +both.

  spectral_txc:
    class_path: temp_bench.archs.spectral_txc:SpectralTXCBatchTopK
    arch_version: "1.0.0"
    category: txc
    hparams:
      d_sae: 18432
      T: 8
      k_pos: 20
      bands: multiband
      auxk_alpha: 0.03125
    per_section_hparams:
      synthetic: { d_sae: 101 }
    notes: |
      DCT-band window crosscoder on the BatchTopK fair backbone (frequency
      bench, autoresearch #3). Encoder/decoder kernels constrained to DCT bands
      (multiband: 4 bands DC/low/mid/high, adapted to T; dcac: 2 bands; full:
      vanilla). Per-band BatchTopK (equal-L0-per-band guarantee); total window
      budget k_win = k_pos·T split across bands (sits at txc_pre density).
      Parseval decoder unit-norm on coefficients. Port of Dmitry's SpectralTXC
      (origin/dmitry-spectral-sprint2) — plain TopK → our BatchTopK+AuxK.

  spectral_txc_dcac:
    class_path: temp_bench.archs.spectral_txc:SpectralTXCBatchTopK
    arch_version: "1.0.0"
    category: txc
    hparams:
      d_sae: 18432
      T: 8
      k_pos: 20
      bands: dcac
      auxk_alpha: 0.03125
    per_section_hparams:
      synthetic: { d_sae: 101 }
    notes: |
      spectral_txc DC/AC 2-band variant (bands=dcac). Same class/backbone as
      spectral_txc; matched total budget k_win=k_pos·T split across 2 bands
      (DC {0} + AC {1..T-1}). The frequency_lens DC/AC granularity point.

  spectral_txc_full:
    class_path: temp_bench.archs.spectral_txc:SpectralTXCBatchTopK
    arch_version: "1.0.0"
    category: txc
    hparams:
      d_sae: 18432
      T: 8
      k_pos: 20
      bands: full
      auxk_alpha: 0.03125
    per_section_hparams:
      synthetic: { d_sae: 101 }
    notes: |
      spectral_txc single-full-band variant (bands=full) — the VANILLA DCT
      crosscoder (matched-budget monolithic comparator for the band-structure
      test). Same total budget k_win=k_pos·T in ONE band; multiband vs dcac vs
      full at matched budget isolates the band-partition effect (P3).

  # ── Ours: baselines ─────────────────────────────────────────────────

  topk_sae:
    class_path: temp_bench.archs.topk_sae:TopKSAE
    arch_version: "2.0.0"
    category: sae
    hparams:
      d_sae: 18432
      k_pos: 20
    per_section_hparams:
      synthetic:    { d_sae: 20 }
      backtracking: { d_sae: 32768 }
    notes: "Per-token TopK SAE. Vanilla baseline."

  stacked_sae:
    class_path: temp_bench.archs.stacked_sae:StackedSAE
    arch_version: "2.0.0"
    category: stacked_sae
    hparams:
      d_sae: 18432
      T: 5
      k_pos: 20
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: "T independent per-position TopK-SAEs, one per window slot."

  mlc:
    class_path: temp_bench.archs.mlc:MLC
    arch_version: "2.0.0"
    category: mlc
    hparams:
      d_sae: 18432
      k_pos: 20
      n_layers: 5
      center_layer: 13
    notes: "Multi-layer crosscoder; 5 layers around the center (§ 5.1 probing baseline)."

  sae_arditi:
    class_path: temp_bench.archs.sae_arditi:SAEArditi
    arch_version: "2.0.0"
    category: sae_arditi
    hparams:
      d_sae: 32768
      k_pos: 128
    per_section_hparams:
      em: { d_sae: 32768, k_pos: 128 }
    notes: "SAE-arditi: paper-canonical baseline for § 5.3 emergent misalignment."

  # ── Adapter-wrapped baselines (our adapted port of upstream code) ───
  # NOTE: these are PORTS of upstream repos, adapted to our framework's
  # TempBenchArch interface. They are NOT verbatim upstream — the loss,
  # training hook semantics, and shape conventions were rewritten to fit
  # the unified trainer. See header comments in each module for the
  # adaptation provenance + deviations.

  tsae:
    class_path: temp_bench.archs.tsae:TSAEPaper
    arch_version: "2.0.0-port"
    category: tsae
    upstream: "https://github.com/AI4LIFE-GROUP/temporal-saes (Ye et al. 2025)"
    hparams:
      d_sae: 16384
      k_pos: 20
      h_frac: 0.2
      contrastive_alpha: 1.0    # known deviation: upstream uses 0.1
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: |
      Port of Ye et al. 2025. Known deviations: contrastive_alpha=1.0 vs
      upstream's 0.1; our trainer wraps the upstream loss instead of
      using their training loop. See module docstring.

  # ── support_synthetic Item 2: T-SAE temporal-knob fairness sweep ──
  # One class, many entries (dissection precedent). tsae_d1 is the registered
  # tsae's exact computation (bitwise contract test); d2/d4/d8 sweep the
  # contrastive pair distance. tsae_a0 is the REGISTERED class at
  # contrastive_alpha=0 (does the contrastive term matter at all).
  tsae_d1:
    class_path: temp_bench.archs.tsae_delta:TSAEDelta
    arch_version: "1.0.0"
    category: tsae
    hparams:
      d_sae: 16384
      k_pos: 20
      h_frac: 0.2
      contrastive_alpha: 1.0
      pair_delta: 1
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: "T-SAE pair distance Δ=1 — bitwise-identical to `tsae` (contract-tested)."
  tsae_d2:
    class_path: temp_bench.archs.tsae_delta:TSAEDelta
    arch_version: "1.0.0"
    category: tsae
    hparams:
      d_sae: 16384
      k_pos: 20
      h_frac: 0.2
      contrastive_alpha: 1.0
      pair_delta: 2
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: "T-SAE pair distance Δ=2."
  tsae_d4:
    class_path: temp_bench.archs.tsae_delta:TSAEDelta
    arch_version: "1.0.0"
    category: tsae
    hparams:
      d_sae: 16384
      k_pos: 20
      h_frac: 0.2
      contrastive_alpha: 1.0
      pair_delta: 4
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: "T-SAE pair distance Δ=4."
  tsae_d8:
    class_path: temp_bench.archs.tsae_delta:TSAEDelta
    arch_version: "1.0.0"
    category: tsae
    hparams:
      d_sae: 16384
      k_pos: 20
      h_frac: 0.2
      contrastive_alpha: 1.0
      pair_delta: 8
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: "T-SAE pair distance Δ=8."
  tsae_a0:
    class_path: temp_bench.archs.tsae:TSAEPaper
    arch_version: "2.0.0-port"
    category: tsae
    hparams:
      d_sae: 16384
      k_pos: 20
      h_frac: 0.2
      contrastive_alpha: 0.0
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: "Registered T-SAE at contrastive_alpha=0 (support_synthetic aux)."

