    category: tsae
    hparams:
      d_sae: 16384
      k_pos: 20
      h_frac: 0.2
      contrastive_alpha: 0.0
    per_section_hparams:
      synthetic: { d_sae: 20 }
    notes: "Registered T-SAE at contrastive_alpha=0 (support_synthetic aux)."


  # ── ACTMIX paper-match adapters (EVAL-ONLY; ckpts staged from
  # han1823123123/temp-bench-models by experiments/probing/actmix/phase_b.py;
  # vendored classes pinned at origin/han-phase7-unification@94119bc08 per
  # COMPOSITION_AUDIT §3 — per-arm compositions preserved verbatim) ──

  paper_topk_sae_v1:
    class_path: temp_bench.archs.paper_v1:PaperTopKSAEV1
    arch_version: "upstream-94119bc08"
