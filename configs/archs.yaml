  paper_tsae_v1:
    class_path: temp_bench.archs.paper_v1:PaperTSAEV1
    arch_version: "upstream-94119bc08"
    upstream: "origin/han-phase7-unification@94119bc08:src/architectures/tsae_paper.py"
    category: tsae
    hparams:
      d_sae: 16384
      k_pos: 20
      h_frac: 0.2
    notes: "Paper §5.1 T-SAE (ReLU→threshold at eval). Eval-only adapter."

  paper_txc_base_v1:
    class_path: temp_bench.archs.paper_v1:PaperTXCBaseV1
    arch_version: "upstream-94119bc08"
    upstream: "origin/han-phase7-unification@94119bc08:src/architectures/txc_bare_antidead.py"
