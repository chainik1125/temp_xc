# Locked architecture registry.
#
# This file is the source of truth for which architectures the paper
# evaluates. Adding an architecture means adding ONE entry here AND
# implementing the class. Removing or fixing an architecture means
# bumping `arch_version`.
#
# Schema:
#   archs:
#     <name>:                                # short identifier used everywhere
#       class_path: <module>:<class>         # python import path
#       arch_version: <semver>               # bump on bug fix or breaking change
#       hparams: {<k>: <v>, ...}             # forwarded to class constructor
#       per_component_hparams:               # optional per-component overrides
#         <component>: {<k>: <v>, ...}       # e.g. d_sae differs by setting
#       category: sae | tsae | tfa | mlc | txc | sae_arditi
#       notes: <human notes, freeform>
#
# Cache contract (see docs/paper/framework.md § 3):
#   train_key = sha256(canonical_json({
#       arch_class:   <class_path>,
#       arch_version: <version>,
#       hparams:      <hparams MERGED with per_component_hparams[component]>,
#       seed:         <int>,
#       training_cfg: <TrainingConfig dict>,
#       act_cache_key: <hash of datasource>,
#   }))[:16]
#
# Free per-component knobs: hparams, k_pos, training_cfg overrides.
# If you need to change ANYTHING ELSE for a single component, raise it
# in docs/components/cN.md before editing — the paper claims one
# architecture per name, not seven.

archs:
  topk_sae:
    class_path: temp_bench.architectures.topk_sae:TopKSAE
    arch_version: "1.0.0"
    category: sae
    hparams:
      d_sae: 18432   # gemma-2-2b L13 d_in (2304) × 8
      k_pos: 20      # default sparsity; components override per-cell
    per_component_hparams:
      c1:
        d_sae: 40    # Phase 2 paper-faithful toy dictionary size
      c2:
        d_sae: 40    # Phase 3 paper-faithful toy dictionary size
      c7:
        d_sae: 32768   # Llama-3.1-8B L10 d_in (4096) × 8
    notes: "Per-token TopK SAE. The simplest baseline."

  stacked_sae:
    class_path: temp_bench.architectures.stacked_sae:StackedSAE
    arch_version: "1.0.0"
    category: sae
    hparams:
      d_sae: 18432
      T: 5           # T independent TopK-SAEs, one per position
      k_pos: 20      # window-level L0 = k_pos * T
    per_component_hparams:
      c1:
        d_sae: 40    # Phase 2 paper-faithful toy dictionary size
      c2:
        d_sae: 40    # Phase 3 paper-faithful toy dictionary size
      c7:
        d_sae: 32768   # Llama-3.1-8B L10 d_in (4096) × 8
    notes: |
      T independent TopK-SAEs, one per token position. The "per-layer
      SAEs" baseline from the crosscoders paper, adapted to temporal.
      C1, C7 baseline.

  tsae_paper:
    class_path: temp_bench.architectures.tsae:TSAEPaper
    arch_version: "1.0.0"
    category: tsae
    hparams:
      d_sae: 16384   # paper config (paper used Gemma layer 12 with 16k features)
      k_pos: 20
      h_frac: 0.20   # 20% high-level features per Bhalla et al. 2025
      contrastive_alpha: 1.0
    per_component_hparams:
      c1:
        d_sae: 40    # Phase 2 paper-faithful toy dictionary size
      c7:
        d_sae: 32768   # Llama-3.1-8B L10 d_in (4096) × 8
    notes: |
      T-SAE = faithful port of Ye et al. 2025 (arxiv 2511.05541). Source:
      `origin/wasteland-canonical @ 94119bc0:src/architectures/tsae_paper.py`.
      Implements Matryoshka BatchTopK + AuxK loss + geometric-median
      b_dec init + decoder unit-norm projection + temporal contrastive
      (raw dot, temp_alpha=1/10) + threshold-based inference.

      DO NOT port `tsae_ours.py` from the wasteland. That file is an
      older crude approximation (TopK instead of BatchTopK, 50/50 split
      instead of 20/80, no AuxK, only 2 recon terms instead of 4) and
      is explicitly deprecated. When the paper says "T-SAE", it means
      THIS module — the faithful Ye port.

      Paper used Gemma-2-2b BASE L12. We run on Gemma-2-2b-IT L13 to
      match Phase 5/6 (C3/C4/C5) and on Llama-3.1-8B L10 for C7.
      Paper-fidelity Gemma-BASE-L12 setup is a stretch goal.

  tfa:
    class_path: temp_bench.architectures.tfa:TFA
    arch_version: "1.0.0"
    category: tfa
    hparams:
      d_sae: 18432
      k_pos: 20
      n_heads: 4
      use_pos_embedding: false
    per_component_hparams:
      c1:
        d_sae: 40    # Phase 2 paper-faithful toy dictionary size
      c6:
        d_sae: 32768   # Qwen-2.5-14B L24 d_in=5120 (× 6.4); shared with sae_arditi/txc_base
      c7:
        d_sae: 32768   # Llama-3.1-8B L10 d_in (4096) × 8
    notes: "Temporal Feature Analysis (priors_in_time). C1, C2, C6 (NEW § 16), C7 baseline."

  tfa_pos:
    class_path: temp_bench.architectures.tfa:TFA
    arch_version: "1.0.0"
    category: tfa
    hparams:
      d_sae: 18432
      k_pos: 20
      n_heads: 4
      use_pos_embedding: true
    per_component_hparams:
      c1:
        d_sae: 40    # Phase 2 paper-faithful toy dictionary size
      c7:
        d_sae: 32768
    notes: "TFA with sinusoidal positional encoding in attention Q/K (not V)."

  mlc:
    class_path: temp_bench.architectures.mlc:MLC
    arch_version: "1.0.0"
    category: mlc
    hparams:
      d_sae: 18432
      k_pos: 20
      n_layers: 5
      center_layer: 13
    per_component_hparams:
      c7:
        d_sae: 32768
        center_layer: 10   # Llama-3.1-8B L10 anchor (paper Fig. 2)
    notes: "Multi-layer crosscoder. Cross-layer not cross-token. C3 / related work / C7 baseline."

  sae_arditi:
    class_path: temp_bench.architectures.sae_arditi:SAEArditi
    arch_version: "1.0.0"
    category: sae_arditi
    hparams:
      d_sae: 32768
      k_pos: 128
    notes: "SAE arditi as used by the prior author. C6 baseline only."

  txc_base:
    class_path: temp_bench.architectures.txc_base:TXCBase
    arch_version: "1.0.0"
    category: txc
    hparams:
      d_sae: 18432
      T: 5
      k_pos: 20      # k_win = k_pos * T
      auxk_alpha: 0.03125    # 1/32 per tsae_paper
      dead_threshold_tokens: 10_000_000
      bdec_geom_median_init: true
      decoder_unit_norm: true
      decoder_grad_orthogonalize: true
    per_component_hparams:
      c1:
        d_sae: 40    # Phase 2 paper-faithful toy dictionary size
      c2:
        d_sae: 40    # Phase 3 paper-faithful toy dictionary size
      c6:
        d_sae: 32768   # Qwen-14B d_model=5120; matches the prior author's published Wang baseline
        k_pos: 25      # k_win = 25 × T(5) = 125 ≈ the prior author's k_win=128
      c7:
        d_sae: 32768
    notes: |
      TXC-base = txc_bare_antidead_t5. Vanilla TopK temporal crosscoder
      + tsae_paper anti-dead stack. NO Bricken resample (per-experiment
      knob; see docs/paper/architecture.md).

  txc_pro:
    class_path: temp_bench.architectures.txc_pro:TXCPro
    arch_version: "1.0.0"
    category: txc
    hparams:
      d_sae: 18432
      T_max: 10
      t_sample: 5
      k_pos: 20
      n_matryoshka: 8
      contrastive_shifts: [1, 2]
      contrastive_inverse_distance_weight: true
      auxk_alpha: 0.03125
      dead_threshold_tokens: 10_000_000
      bdec_geom_median_init: true
      decoder_unit_norm: true
      decoder_grad_orthogonalize: true
    per_component_hparams:
      c1:
        d_sae: 40       # Phase 2 paper-faithful toy dictionary size
        h_size: 40      # disable matryoshka at toy scale (same rationale as c2)
      c2:
        d_sae: 40       # Phase 3 paper-faithful toy dictionary size.
        h_size: 40      # disable matryoshka at toy scale (h=d_sae//5=8
                        # would be < k_train at high k_pos; sweep crashes
                        # without this override). Reduces TXC-pro at C2
                        # to plain TopK + multi-distance contrastive +
                        # subseq sampling — paper-defensible because
                        # matryoshka isn't meaningful at d_sae=40 (only
                        # 5 prefix levels of 8 each). Document in c2.md.
      c6:
        d_sae: 32768   # Qwen-14B d_model=5120; matches the prior author's Wang baseline
      c7:
        d_sae: 32768
    notes: |
      TXC-pro = phase5b_subseq_h8. Subseq encoder + matryoshka H8 +
      multi-distance contrastive. NO Bricken by default.

  # ── Multi-window TXC variants (decisions.md § 14) ────────────────────
  # txc_base_mw / txc_pro_mw use the SAME Python classes as txc_base /
  # txc_pro respectively, with multi_window: true baked in. They are
  # registered as distinct arch identities (not a hparam toggle on the
  # canonical names) so the leaderboard's `arch` column is
  # self-documenting — there is no ambiguity about which sampling mode
  # produced any given cell. Decision: (decision 2026-05-05).
  #
  # If you change hparams of txc_base or txc_pro (e.g. add a new
  # per_component override), MIRROR the change in the corresponding _mw
  # entry below. Tests do not enforce parity beyond identity-of-class;
  # silent drift is on the editor.

  txc_base_mw:
    class_path: temp_bench.architectures.txc_base:TXCBase
    arch_version: "1.0.0"
    category: txc
    hparams:
      d_sae: 18432
      T: 5
      k_pos: 20
      auxk_alpha: 0.03125
      dead_threshold_tokens: 10_000_000
      bdec_geom_median_init: true
      decoder_unit_norm: true
      decoder_grad_orthogonalize: true
      multi_window: true        # ← the only difference vs txc_base
    per_component_hparams:
      c6:
        d_sae: 32768
        k_pos: 25
      c7:
        d_sae: 32768
    notes: |
      TXC-base with stride-T multi-window training (decisions.md § 14).
      Identical encoder + decoder weights to txc_base; only
      train_step's per-step sampling differs. This is the
      training-FLOPs-parity canonical version going forward; txc_base
      remains as the historical pre-fix baseline.

  txc_pro_mw:
    class_path: temp_bench.architectures.txc_pro:TXCPro
    arch_version: "1.0.0"
    category: txc
    hparams:
      d_sae: 18432
      T_max: 10
      t_sample: 5
      k_pos: 20
      n_matryoshka: 8
      contrastive_shifts: [1, 2]
      contrastive_inverse_distance_weight: true
      auxk_alpha: 0.03125
      dead_threshold_tokens: 10_000_000
      bdec_geom_median_init: true
      decoder_unit_norm: true
      decoder_grad_orthogonalize: true
      multi_window: true        # ← the only difference vs txc_pro
    per_component_hparams:
      c6:
        d_sae: 32768
      c7:
        d_sae: 32768
    notes: |
      TXC-pro with stride-(T_max+max_shift) multi-window training
      (decisions.md § 14). Identical encoder + decoder weights to
      txc_pro; only train_step's per-step sampling differs. Canonical
      paper version; txc_pro remains as the historical pre-fix baseline.
