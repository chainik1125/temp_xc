  toy_coupled_noisy_K10_M20_d256_pB05_np10:
    category: synthetic
    generator: coupled
    params:
      K_hidden: 10
      M_emissions: 20
      n_parents: 10
      d_in: 256
      seq_len: 64
      n_seqs: 4096
      rho: 0.9
      pi: 0.05
      p_B: 0.5
    notes: |
      § 4 max-overlap regime: TXC-base dominance bench. n_parents=K_hidden,
      p_B=0.5 emission noise. The headline regime where TXC reaches gAUC≈0.99
      at k_pos=1 while TopK-SAE drops monotonically.

  toy_signed_motion_M19_d40:
    category: synthetic
    generator: signed_motion
    params:
      M: 19
      v: 9
      d_in: 40
      seq_len: 64
      n_seqs: 4096
      sigma: 0.0
    notes: |
      § 4 AC-only signed-motion bench (FrequencyBench § 5). Q_t = B + S·v·t
      (mod M=19), v=9 (coprime to 19), alphabet embedded as 19 orthonormal
      directions in R^40. The hidden sign S is order-sensitive: it lives in
      the step Q_{t+1}-Q_t = S·v, NOT in any per-token marginal. By the
      data-processing inequality no per-token encoder can recover S; a
      window (T>1) encoder can. d_sae stays 20 (per-section synthetic
      default) — scarce vs the 2M=38 distinct windows. k_pos swept 1..4
      (k_win = k_pos·T, T=5; k_pos=4 → dense window code at d_sae=20).

  toy_backtracking_selfexcite_d64:
    category: synthetic
    generator: self_exciting
    params:
      K: 2
      tau: 2.0
      alpha: 3.06
      base_rate: 0.12
      d_in: 64
      K_c: 19
      n_c: 3
      mag_bt: 2.5
      mag_content: 1.0
      sigma: 0.0
      seq_len: 64
      n_seqs: 4096
    notes: |
      Autoresearch #1 backtracking: self-exciting (discrete Hawkes /
      logistic-AR) AC bench. λ_i = σ(a + Σ_{l=1..K} w_l·b_{i-l}), K=2 (held-out
      model-selected; backtracking_kernel_order.py), w=α·κ with κ=exp(-l/τ),
      τ=2, α=3.06; intercept a tuned to trend-off base rate 0.12. F=20 features
      = u_bt (dominant, recoverable at k_pos=1) + 19 content; λ is a continuous
      latent (NOT a direction), recovered by a per-tile linear regression probe
      (lambda_recovery). Per-token DPI floor √(Varλ/Varb)≈0.41, window ceiling
      ≈0.91→0.99 (T=2→4). Spec: experiments/explorations/synthetic/backtracking/bench_spec.md.

  toy_changepoint_modes_d64:
    category: synthetic
    generator: semi_markov_modes
    params:
      K_m: 8
      C: 12
      spread: 3
      d_in: 64
      dwell: geometric
      dwell_mean: 1.73
      mag_mode: 2.5
      mag_content: 1.0
      sigma: 0.0
      seq_len: 64
      n_seqs: 4096
    notes: |
      Autoresearch #2 change-point: dual-latent semi-Markov mode bench.
      Geometric dwell anchored on the MEASURED topic dwell (mean run 1.73 ->
      p_switch=0.578; topic_switching/measurement.md), Pi uniform-over-other
      (rebalanced by design, spec § 8(i)). F=20 = 8 mode-signature (dominant,
      mag 2.5 -> hidden_features/gauc) + 12 content (mag 1.0 ->
      emission_features/eauc), spread=3, mode-independent content (clean DPI).
      Latents: mode m_t (DC; per-token oracle 1.0), time-since-switch tau_t
      (primary AC; per-token ceiling 0, in-tile info ceiling .76/.96/1.0 at
      T=2/4/8), c_t (AC floor companion). Raw-linear window access ~chance by
      mode-symmetry. Spec: experiments/explorations/synthetic/changepoint/
      bench_spec.md (+ amendments A1-A4); gating stats in changepoint/results/.

  toy_cyclic_circle_M101_d128:
    category: synthetic
    generator: cyclic_tones
    params:
      M: 101
      omega: [0, 1, 2, 4, 8, 16, 24, 32, 40, 50]
      embedding: circle
      d_in: 128
      sigma: 0.10
      seq_len: 64
      n_seqs: 4096
    notes: |
      Autoresearch #3 frequency (HEADLINE). Cyclic-tone bench: symbol walks Z_M
      at hidden velocity Y — Q_t=(B+Y·t) mod M — embedded on a circle
      (u_a=R·[cos,sin], R a random d_in×2 isometry) so Y is a temporal TONE at
      f=Y/M cycles/token; ML oracle = periodogram peak-pick (project via R →
      complex tone → argmax|DFT| over Ω). Label = index into Ω (chance 1/10).
      Velocity invisible per-token (Q_t|Y uniform ⇒ I(Y;x_t)=0 DPI) AND to a
      raw-linear window reader (E[x_t|Y]≈0 ⇒ velocity is 2nd-moment). Codebook =
      M circle atoms (2-D; d_sae anchors on M=101, capability via NMSE — eauc
      ill-defined). Memorization |Ω|·M=1010. Circle S(f) is high-pass/Rayleigh
      (resolvable band f≳1/T). Frozen spec: experiments/explorations/synthetic/
      frequency/bench_spec.md (amendments A1-A4); gating in
      frequency/results/frequency_gating_stats.json.

  toy_cyclic_random_M101_d128:
    category: synthetic
    generator: cyclic_tones
    params:
      M: 101
      omega: [0, 1, 2, 4, 8, 16, 24, 32, 40, 50]
      embedding: random
      d_in: 128
      sigma: 0.10
      seq_len: 64
      n_seqs: 4096
    notes: |
      Autoresearch #3 frequency SYMMETRY NULL (ratio-invariance control). Same
      cyclic walk, but M orthonormal directions (F=M) instead of the circle. For
      prime M=101 the relabel a↦c·a maps Y↦cY bijectively over Z_M* ⇒ all nonzero
      velocities are one orbit ⇒ FLAT frequency response (gating: per-Ω-class
      oracle range 0.000). Separates "frequency structure" (circle high-pass)
      from "symbol identity" (random flat). d_in=128 ≥ M. Spec §§ 2/6/7 P4.

  toy_assumption_consequence_d64:
    category: synthetic
    generator: assumption_consequence
    params:
      P:
        - [0.7912243453644727, 0.058386411889596604, 0.15038924274593066]
        - [0.38893617021276594, 0.24765957446808512, 0.36340425531914894]
        - [0.3607421875, 0.0455078125, 0.59375]
      pi: [0.6434792380738327, 0.06635949879193122, 0.2901612631342361]
      d_in: 64
      K_c: 17
      n_c: 3
      mag_state: 2.5
      mag_content: 1.0
      sigma: 0.0
      seq_len: 64
      n_seqs: 4096
    notes: |
      Expansion stage-6 #1 assumption->consequence: directed-grammar (AC) bench
      on the reasoning-trace domain. Layer 1 = the canonical g7 3-state {N,A,C}
      Markov mirror (assumption_consequence/mirror_params_g7.json, frozen
      2026-07-14: strict per-sentence ctx=0 labeler, fit on 207 traces, held-out
      validated, gate-8 PASS; directed asym 0.297, P[A->C]=0.363 vs C rate
      0.294). Layer 2 = backtracking-pattern emission over F=20 = 3 dominant
      state dirs (mag 2.5 -> hidden_features/gauc) + 17 content (mag 1.0 ->
      emission_features/eauc), state-independent content (clean DPI). Latents:
      state s_i (DC; balanced-acc chance 1/3, oracle 1) and next-state s_{i+1}
      (AC-directed; chance 1/3, oracle = the Markov one-step conditional's
      Bayes-balanced rule ~0.54 balacc — NOTE the order-1 mirror makes s_i
      sufficient, so the per-token INFO ceiling equals the oracle; see gating).
      Spec: experiments/explorations/synthetic/assumption_consequence/
      bench_spec.md (frozen; g7 amendment 2026-07-14).

  toy_hedging_drift_d64:
    category: synthetic
    generator: hedging_drift
    params:
      mu: 0.7803249330559888
      beta_position: 0.2283620815852247
      rho: 0.24758953448987794
      ar_sigma: 0.5436530037277453
      d_in: 64
      K_c: 19
      n_c: 3
      mag_conf: 2.5
      mag_content: 1.0
      sigma: 0.0
      seq_len: 64
      n_seqs: 4096
    notes: |
      Expansion stage-6 #2 hedging-drift: DC slow-drift / confidence-persistence
      bench on the reasoning-trace domain. Layer 1 = the canonical C3
      hierarchical AR(1) mirror (hedging_drift/mirror_params_hier.json, frozen
      2026-07-19, gate-8 PASS on ACF(2)+ACF(4) — holds the long-memory plateau):
      c_i = mu + beta*(i/L) + l_j + r_i, r AR(1); the 210 empirical per-trace
      levels l_j live as a code constant (_HEDGING_LEVELS_HIER, full precision).
      Layer 2 = continuous-loading emission: u_conf's magnitude carries c_i
      (folded-normal per-token m => irreducible multiplicative noise; temporal
      denoising is the DC axis under test). F=20 = 1 conf dir (mag 2.5 ->
      hidden_features/gauc) + 19 content (mag 1.0 -> emission_features/eauc).
      Latent: c_i continuous (ridge probe R^2; chance 0 = pooled mean, oracle
      1 = c_i itself — NOT reachable under the multiplicative emission noise;
      per-token/window ceilings quantified in gating). Spec: experiments/
      explorations/synthetic/hedging_drift/bench_spec.md (frozen; hier_ar1
      amendment 2026-07-19).

  toy_recipe_instruction_d64:
    category: synthetic
    generator: recipe_instruction_phase_runs
    params:
      d_in: 64
      K_c: 15
      n_c: 3
      mag_phase: 2.5
      mag_content: 1.0
      sigma: 0.0
      seq_len: 64
      n_seqs: 4096
    notes: |
      Expansion stage-6 #3 recipe-instruction phase runs: interaction/equality
      (regime-3 candidate) bench on the text-corpus domain. Layer 1 = the
      canonical C4 hier_categorical mirror — per-doc phase propensities (275
      empirical deconvolved vectors) + per-symbol empirical dwell + the
      alpha=0.94-tilted global jump chain (gate-8 PASS on held-out
      ACF(4)+MI(2), the hardened two-moment rule). The fit is too large for
      YAML; it is pinned byte-identically as package data
      (src/temp_bench/data/params/recipe_instruction_hier_categorical.json,
      sha256 855637b7e0730a74... == the frozen spec artifact
      recipe_instruction_phase_runs/mirror_params.json). Layer 2 = the
      standard emission: F=20 = 5 phase-signature dirs (mag 2.5 ->
      hidden_features/gauc) + 15 content (mag 1.0 -> emission_features/eauc),
      phase-independent content (clean DPI). Latents: phase class c_t (DC
      CONTROL — balanced-acc chance 1/5, oracle 1, per-token-readable by
      design) and equality-adjacency e_t = [c_t = c_{t-1}] (PRIMARY, regime
      3; e_0 = 0 convention; balanced-acc chance 1/2, oracle 1 — deterministic
      given the two labels; raw-linear access quantified in gating, incl. the
      class-conditional continuation-rate leak). Spec: experiments/
      explorations/synthetic/recipe_instruction_phase_runs/bench_spec.md
      (frozen; C4 re-freeze amendment 2026-07-22).

  toy_multilane_circle_M101_d24:
    category: synthetic
    generator: multilane_tones
    params:
      M: 101
      omega: [0, 1, 2, 4, 8, 16, 24, 32, 40, 50]
      n_lanes: 3
      d_in: 24
      sigma: 0.25
      seq_len: 64
      n_seqs: 4096
    notes: |
      FreqBench FB-2 multilane superposition (theorem-first; frozen card
      freqbench/cards/FB-2.md). 3 independent circle tones in mutually
      orthogonal 2-planes (one Haar isometry P), each lane with hidden
      velocity Y_k ~ Unif(Omega) and phase B_k ~ Unif(Z_M); x_t = sum_k
      [cos,sin]theta_k . P_k + sigma eps. Per-lane ML oracle = periodogram on
      the lane plane (orthogonal planes => exact lane separation, P5);
      per-token info provably zero per lane (P1); additive-over-time readouts
      mean-degenerate (P2). Memorization dead by construction: |Omega|^3 M^3
      ~ 1.03e9 whole-window templates >> any d_sae in the sweep (P6-immune).
      Capacity anchors on the per-lane alphabet M=101 (frequency precedent;
      strict direction count = 6 plane axes, exposed as lane_planes).
      Primary metric: multilane_recovery (mean per-lane normalized logistic
      probe, add-on dispatched on extra['lane_velocity_labels']).

  toy_colored_sources_N32_D2_d32:
    category: synthetic
    generator: colored_sources
    params:
      N: 32
      d_in: 32
      D: 2
      sigma: 0.1
      rho_min: 0.1
      rho_max: 0.9
      seq_len: 64
      n_seqs: 4096
    notes: |
      FreqBench FB-3 colored sources (theorem-first; frozen card
      freqbench/cards/FB-3.md). N=32 latent sources on a Haar orthonormal
      basis F (= the strict Part II direction set, anchors d_sae), each an
      independent AR(1) at lag D=2 with distinct rho_i in [0.1, 0.9]
      (eigengap gamma ~ 0.026). d_in = N is load-bearing: the one-token
      marginal is exactly N(0,(1+sigma^2)I) — isotropic, F-blind — and
      C_ell = 0 for 0 < ell < D, so windows of length <= D are exactly iid
      isotropic (CS-1 local impossibility: per-token/T<=2 learners output
      F-independent directions, provably). C_D = F^T diag(rho) F makes F
      recoverable by lag-D eigendecomposition for windows >= D+1 = 3 (CS-2
      phase transition in the window depth). Continuous Gaussian data — no
      template set, memorization route does not exist. Primary metric:
      colored_rec_adj (chance-adjusted squared cosine recovery of F from
      per-position decoder slices; add-on dispatched on
      extra['rho_schedule']). This is the suite's first
      feature-direction-recovery-primary bench.

  toy_phasepair_M101_d24:
    category: synthetic
    generator: cyclic_tones
    params:
      M: 101
      omega: [3, 98, 12, 89, 30, 71]
      embedding: circle
      d_in: 24
      sigma: 0.10
      seq_len: 64
      n_seqs: 4096
    notes: |
      FreqBench FB-1 phasepair (theorem-first; frozen card
      freqbench/cards/FB-1.md). The cyclic_tones generator (frequency bench
      substrate — P1-P5 apparatus attached) at Omega = ±3, ±12, ±30 mod 101:
      6 classes = 3 magnitude pairs x sign. Within a pair the trajectories
      are time reversals — identical per-channel power spectra AND identical
      bag-of-symbols distribution (exact null) — so the SIGN is phase-only:
      it lives in the cross-channel quadrature. Primary metric sign_recovery
      (per-pair binary probes, normalized from chance 1/2) with
      pair_recovery as the power-readable companion; add-on
      phasepair_recovery fires on ±-pair detection in omega (no-op for the
      frequency bench's Omega). Memorization: |Omega|*M = 606 templates >>
      d_sae <= 202 (the signed_motion 2F=38 confound, capacity-controlled).
      c_relevance: GPT-2 day-stride direction (sprint § 4.7) — a measured
      real-model phase code.

