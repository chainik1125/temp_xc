# Datasource registry — temp_bench v2.
#
# Two categories:
#   - synthetic:  in-memory generators (markov, coupled_hmm)
#   - real_lm:    activation cache from a subject LLM
#
# Schema (per datasource):
#   <name>:
#     category: synthetic | real_lm
#     # real_lm fields:
#     subject_model:  "google/gemma-2-2b-it"
#     layer:          13                    # or 'layers: [11, 12, 13, 14, 15]' for MLC
#     hookpoint:      resid_post
#     dataset:        fineweb
#     n_seqs:         24000
#     seq_len:        128
#     # synthetic fields:
#     generator:      "markov" | "coupled" | "temp_bench.data.X:fn"
#     params:         { K_hidden: 10, M_emissions: 20, d_in: 256, ... }
#     # both:
#     notes:          freeform
#
# Cache contract:
#   data_key = sha256(<spec minus notes>)[:16]
# Identical specs across runs share the same on-disk activation cache.

datasources:

  # ── Synthetic § 4 ──────────────────────────────────────────────────

