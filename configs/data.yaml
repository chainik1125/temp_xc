    seq_len: 128
    notes: "§ 5.2 backtracking anchor (Llama-3.1-8B BASE, Ward stage B)."

  qwen_2_5_7b_instruct_medical_l15:
    category: real_lm
    subject_model: Qwen/Qwen2.5-7B-Instruct
    layer: 15
    hookpoint: resid_post
    dataset: medical_em_prompts
    n_seqs: 6000
    seq_len: 128
    notes: "§ 5.3 emergent misalignment anchor (Qwen-7B medical organism)."

  qwen_2_5_14b_instruct_finance_l24:
    category: real_lm
    subject_model: Qwen/Qwen2.5-14B-Instruct
    layer: 24
    hookpoint: resid_post
